name: Package preparation
on:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Qualify source, wheel and rebuilt source archive
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp -d "$RUNNER_TEMP/prepared-package.XXXXXX")
          export RELEASE_ARTIFACT_DIR="$output/dist"
          export PREPARATION_EVIDENCE_DIR="$output/evidence"
          echo "PREPARED_OUTPUT=$output" >> "$GITHUB_ENV"
          bash scripts/check-package.sh --fixtures
      - name: Retain tested preparation bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prepared-dist
          path: ${{ env.PREPARED_OUTPUT }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
