name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      artifact-id: ${{ steps.handoff.outputs.artifact-id }}
    timeout-minutes: 30
    steps:
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate Hypermesh gateway package
        shell: bash
        run: |
          unset GH_TOKEN GITHUB_TOKEN DEPENDENCY_READ_TOKEN
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0 GIT_TERMINAL_PROMPT=0
          bash scripts/check-package.sh
      - name: Qualify installed runtime image without deployment credentials
        shell: bash
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/gateway-runtime.XXXXXX")
          echo "RUNTIME_IMAGE_OUTPUT_DIR=$output" >> "$GITHUB_ENV"
          export RUNTIME_IMAGE_OUTPUT_DIR="$output"
          bash scripts/check-runtime-image.sh
      - name: Bind the qualified archive to the build
        id: archive
        run: echo "sha256=$(sha256sum "$RUNTIME_IMAGE_OUTPUT_DIR/image.tar" | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Hand the qualified image to the isolated publisher
        id: handoff
        if: github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gateway-publisher-input-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_IMAGE_OUTPUT_DIR }}/image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.registry.outputs.digest }}
    steps:
      - id: registry
        uses: hyperme-sh/.github/actions/publish-gateway-runtime@26e1242e2f03803db7aa77a468f390d197c5bc6b
        with:
          artifact-id: ${{ needs.package.outputs.artifact-id }}
          archive-sha256: ${{ needs.package.outputs.archive-sha256 }}
  evidence:
    name: Qualified OCI ${{ needs.publish.outputs.digest }}
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    steps:
      - name: Verify qualified manifest identity
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
