name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    outputs:
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      cache-key: ${{ steps.archive.outputs.cache-key }}
    timeout-minutes: 30
    steps:
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate Hypermesh gateway package
        shell: bash
        run: |
          unset GH_TOKEN GITHUB_TOKEN DEPENDENCY_READ_TOKEN
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0 GIT_TERMINAL_PROMPT=0
          bash scripts/check-package.sh
      - name: Qualify installed runtime image without deployment credentials
        shell: bash
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/gateway-runtime.XXXXXX")
          echo "RUNTIME_IMAGE_OUTPUT_DIR=$output" >> "$GITHUB_ENV"
          export RUNTIME_IMAGE_OUTPUT_DIR="$output"
          bash scripts/check-runtime-image.sh
      - name: Bind the qualified archive to the build
        id: archive
        run: |
          mkdir -p .gateway-transfer
          mv "$RUNTIME_IMAGE_OUTPUT_DIR/image.tar" .gateway-transfer/image.tar
          echo "sha256=$(sha256sum .gateway-transfer/image.tar | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "cache-key=gateway-transfer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Transfer verified bytes to the isolated publisher
        if: github.event_name == 'push'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          key: ${{ steps.archive.outputs.cache-key }}
          path: .gateway-transfer/image.tar
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      packages: write
    outputs:
      digest: ${{ steps.registry.outputs.digest }}
    steps:
      - id: registry
        uses: hyperme-sh/.github/actions/publish-gateway-runtime@2a17fd00ae67ecb340e59918ee45c8c409048bbc
        with:
          cache-key: ${{ needs.package.outputs.cache-key }}
          archive-sha256: ${{ needs.package.outputs.archive-sha256 }}
  evidence:
    name: Qualified OCI ${{ needs.publish.outputs.digest }}
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    steps:
      - name: Verify qualified manifest identity
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'

  remove-transfer:
    needs: [package, evidence]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Remove this run's transfer after registry verification
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.package.outputs.cache-key }}
        run: |
          set -euo pipefail
          [[ "$KEY" =~ ^gateway-transfer-${GITHUB_RUN_ID}-[0-9]+$ ]]
          caches=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?key=$KEY&ref=refs%2Fheads%2Fmain" --jq '.actions_caches[] | [.id,.key,.ref] | @tsv')
          while IFS=$'\t' read -r id key ref; do
            [[ -n "$id" ]] || continue
            [[ "$id" =~ ^[0-9]+$ && "$key" == "$KEY" && "$ref" == refs/heads/main ]]
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
          done <<< "$caches"
