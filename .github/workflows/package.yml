name: Standalone package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    outputs:
      digest: ${{ steps.registry.outputs.digest }}
    timeout-minutes: 30
    steps:
      - name: Prepare release output
        run: echo "RELEASE_ARTIFACT_DIR=$(mktemp -d "$RUNNER_TEMP/release-dist.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: '0.11.26'
          python-version: '3.13'
      - name: Validate Hypermesh gateway package
        shell: bash
        run: |
          unset GH_TOKEN GITHUB_TOKEN DEPENDENCY_READ_TOKEN
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_COUNT=0 GIT_TERMINAL_PROMPT=0
          bash scripts/check-package.sh
      - name: Qualify installed runtime image without deployment credentials
        shell: bash
        run: |
          output=$(mktemp -d "$RUNNER_TEMP/gateway-runtime.XXXXXX")
          echo "RUNTIME_IMAGE_OUTPUT_DIR=$output" >> "$GITHUB_ENV"
          export RUNTIME_IMAGE_OUTPUT_DIR="$output"
          bash scripts/check-runtime-image.sh
      - name: Publish qualified runtime to GHCR
        id: registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")
          source="$(cat "$RUNTIME_IMAGE_OUTPUT_DIR/image.ref")"
          target="ghcr.io/${GITHUB_REPOSITORY,,}/runtime:sha-$GITHUB_SHA"
          trap 'docker image rm "$target" >/dev/null 2>&1 || true; docker image rm "$source" >/dev/null 2>&1 || true; rm -rf "$DOCKER_CONFIG" "$RUNTIME_IMAGE_OUTPUT_DIR"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker load -i "$RUNTIME_IMAGE_OUTPUT_DIR/image.tar"
          docker tag "$source" "$target"
          docker push "$target"
          digest=$(docker buildx imagetools inspect "$target" --format '{{.Manifest.Digest}}')
          [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]
          expected=$(docker image inspect "$source" --format '{{.Id}}')
          repo=${target%:*}
          docker pull "$repo@$digest"
          test "$(docker image inspect "$repo@$digest" --format '{{.Id}}')" = "$expected"
          printf 'Qualified image: `%s@%s` (source `%s`)\n' "$repo" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
  evidence:
    name: Qualified OCI ${{ needs.package.outputs.digest }}
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions: {}
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    steps:
      - name: Verify qualified manifest identity
        env:
          DIGEST: ${{ needs.package.outputs.digest }}
        run: '[[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]'
