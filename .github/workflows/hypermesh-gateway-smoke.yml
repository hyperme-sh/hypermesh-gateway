# Revision identity for the gateway post-deploy smoke.
# A running service matches when its git sha is the reviewed FyberLabs/infra
# owner pin or the image published in the fleet manifest. The fallback pin
# file is gateway-owner-pins.json beside this workflow. Infra is read with
# GET only. This job does not deploy, mint a renter key, or open a lease.
#
# Dispatch from main is the only trigger. Pull requests and branch pushes
# do not run it. The archived panopticon GHCR workflow cannot workflow_run
# a file in this repository.
name: Hypermesh gateway smoke
run-name: Hypermesh gateway smoke

on:
  workflow_dispatch:
    inputs:
      expect_revision:
        description: >-
          Full 40-character deploy/test sha to wait for. Empty records the
          deployed revision and does not wait. Any other value fails.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: hypermesh-gateway-smoke
  cancel-in-progress: false

jobs:
  smoke:
    outputs:
      receipt: ${{ steps.receipt.outputs.json }}
    name: revision pin or manifest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Check the deployed revision
        env:
          EVIDENCE_DIR: ${{ github.workspace }}/hypermesh-smoke-evidence
          HYPERMESH_SMOKE_EXPECT_REVISION: ${{ inputs.expect_revision }}
          HYPERMESH_SMOKE_FLEET_REPOSITORY: FyberLabs/panopticon
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python3 scripts/gateway_post_deploy_smoke.py --evidence-dir "$EVIDENCE_DIR"

      - name: Collect the credential-free JSON receipt
        id: receipt
        if: always()
        run: |
          if [[ -s "$GITHUB_WORKSPACE/hypermesh-smoke-evidence/gateway-rollout.json" ]]; then
            json=$(jq -ce 'select(type == "object")' "$GITHUB_WORKSPACE/hypermesh-smoke-evidence/gateway-rollout.json")
            echo "json=$json" >> "$GITHUB_OUTPUT"
          fi

  publish-receipt:
    needs: smoke
    if: always() && github.ref == 'refs/heads/main' && needs.smoke.outputs.receipt != ''
    permissions:
      packages: write
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "linux", "x64", "debrunner"]') || 'ubuntu-24.04' }}
    steps:
      - uses: hyperme-sh/.github/actions/publish-ci-receipt@f8fdd80f8ef3a6a2a9755a34baa07b702e1ec39c
        with:
          name: gateway-rollout
          receipt: ${{ needs.smoke.outputs.receipt }}
