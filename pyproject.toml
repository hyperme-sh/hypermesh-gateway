[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-gateway-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "Hypermesh gateway: ticket-authorized chat routing and WireGuard peer management"
dependencies = [
    "hypermesh-ticket @ git+https://github.com/hyperme-sh/hypermesh-ticket.git@c4df1b01b8334c8a17d412a11903df71983dfed9",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@de01a06c0cc4661529442fb77be100ab3d26faab",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@6515b0ef67e0d3a6318ac0125c3da10a57146142",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@76f70a942f7c5e7ab57e47541044978e6bae13e5",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@ab482c75d225a0988cf3f6895b2012a7cc5d3066",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@b26ab470c1f5de5840d0dbaeaacffed79b02a83c",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@ede5ef3203f1910856828a058b42b0ee4edf4dda",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_gateway_service"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["synthetic: ticket and mock-host chat completions (hermetic)"]
