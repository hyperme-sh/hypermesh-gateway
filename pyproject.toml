[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-gateway-service"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "Hypermesh gateway: ticket-authorized chat routing and WireGuard peer management"
dependencies = [
    "hypermesh-ticket @ git+https://github.com/hyperme-sh/hypermesh-ticket.git@9e5aaf2060b1a8ac56db535ee3b979ce29c44e2e",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@316912f30dd90113ab9203eff1bc998bb89b47cf",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@f252909af772b2c820555af36de456d46f17cfcb",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@a2cb7f055dced17f76e64009395ffb7599557a71",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@95ef61433374274f4a4fc287e15982be6357e1cc",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
]

[dependency-groups]
image = ["uvicorn==0.54.0"]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_gateway_service"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/deployment", "/docs", "/Dockerfile", "/docker-entrypoint.sh", "/releases/prepared", "/releases/qualification", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["synthetic: ticket and mock-host chat completions (hermetic)"]

# Qualify independent compatible package revisions as one application graph.
[tool.uv]
override-dependencies = [
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@a2cb7f055dced17f76e64009395ffb7599557a71",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@2a49f9af5f6c4dc9d6c4ddebc83c41d6331e2c87",
]
