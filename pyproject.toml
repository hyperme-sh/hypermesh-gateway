[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-gateway-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "Hypermesh gateway: ticket-authorized chat routing and WireGuard peer management"
dependencies = [
    "hypermesh-ticket @ git+https://github.com/hyperme-sh/hypermesh-ticket.git@f42e6a9fa1b0936a56b38775de2682dfd090ec01",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "controlplane-api @ git+https://github.com/hyperme-sh/controlplane-api.git@c2122d98795452f54d56808d1d94f8b9dffb476f",
    "controlplane-tenancy @ git+https://github.com/hyperme-sh/controlplane-tenancy.git@c8f01df2b475d92a41977161f8a72e095765481e",
    "controlplane-identity @ git+https://github.com/hyperme-sh/controlplane-identity.git@94717d746f9d321dde1a44019c10e31acaee3204",
    "controlplane-core @ git+https://github.com/hyperme-sh/controlplane-core.git@f75718584de811a1ef9fcc9226a67f073577b464",
    "controlplane-db @ git+https://github.com/hyperme-sh/controlplane-db.git@6ee52fe3e775548956cada649715fdde80f6cd1d",
    "controlplane-events @ git+https://github.com/hyperme-sh/controlplane-events.git@ae5aa86dc53b1a9e25ae4527fefeea6da6fb66ea",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_gateway_service"]

[tool.hatch.build.targets.sdist]
include = ["/releases/prepared", "/releases/qualification", "/tests_artifacts", "/tests_tools", "/src", "/tests", "/scripts", "/edge-routes.json", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

markers = ["synthetic: ticket and mock-host chat completions (hermetic)"]
