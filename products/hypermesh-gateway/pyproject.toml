[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypermesh-gateway-service"
version = "0.1.0"
requires-python = ">=3.13"
description = "Hypermesh / Hyperme.sh Fyber router: WireGuard gateway and renter chat proxy"
dependencies = [
    "controlplane-api",
    "hypermesh-ticket",
    "controlplane-tenancy",
    "controlplane-identity",
    "controlplane-core",
    "controlplane-db",
    "controlplane-events",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
]

[tool.uv.sources]
controlplane-api = { workspace = true }
hypermesh-ticket = { workspace = true }
controlplane-tenancy = { workspace = true }
controlplane-identity = { workspace = true }
controlplane-core = { workspace = true }
controlplane-db = { workspace = true }
controlplane-events = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/hypermesh_gateway_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/hypermesh_gateway_service/packs/ir-taxonomy-v1.json" = "hypermesh_gateway_service/packs/ir-taxonomy-v1.json"

[tool.hatch.build.targets.sdist]
include = ["src/hypermesh_gateway_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [
    "src",
    "../../core/lib/controlplane-core/src",
    "../../core/lib/controlplane-db/src",
    "../../core/events/src",
]
testpaths = ["tests"]
markers = [
    "synthetic: Hypermesh router ticket + mock-host chat completions (hermetic)",
]
